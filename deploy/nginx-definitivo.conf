server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portalproductores.estadiohuracan.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://portalproductores.estadiohuracan.com$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name portalproductores.estadiohuracan.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/portalproductores.estadiohuracan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portalproductores.estadiohuracan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200M;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host portalproductores.estadiohuracan.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
