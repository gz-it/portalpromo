server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portalproductores.estadiohuracan.com;
    server_tokens off;
    if ($host != portalproductores.estadiohuracan.com) { return 444; }
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://portalproductores.estadiohuracan.com$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name portalproductores.estadiohuracan.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/portalproductores.estadiohuracan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portalproductores.estadiohuracan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_tickets off;
    if ($host != portalproductores.estadiohuracan.com) { return 444; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    reset_timedout_connection on;
    limit_conn portal_connections 20;
    limit_req zone=portal_requests burst=30 nodelay;
    limit_req_status 429;
    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/(storage|backups|node_modules|src|scripts|deploy|migrations)(/|$) { return 404; }
    client_max_body_size 200M;
    location = /systems/restore {
        client_max_body_size 1025M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host portalproductores.estadiohuracan.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host portalproductores.estadiohuracan.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
