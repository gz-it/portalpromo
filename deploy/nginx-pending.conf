server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portalproductores.estadiohuracan.com 149.50.151.139;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        default_type text/plain;
        add_header Cache-Control no-store always;
        return 503 "Portal de Productores: preparacion en curso. El acceso actual no cambio.\n";
    }
}
