server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/149.50.156.217/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/149.50.156.217/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 200M;
    include /etc/nginx/snippets/gzit-cctv.conf;
    location / {
        default_type text/plain;
        add_header Cache-Control no-store always;
        return 503 "El Portal de Productores se traslado a https://portalproductores.estadiohuracan.com\n";
    }
}
